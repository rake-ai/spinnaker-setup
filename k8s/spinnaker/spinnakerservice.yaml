apiVersion: spinnaker.io/v1alpha2
kind: SpinnakerService
metadata:
  name: spinnaker
  namespace: spinnaker
spec:
  spinnakerConfig:
    config:
      version: 1.33.0  # Using stable version (2025.4.0 may not be available yet, adjust as needed)
      
      # Persistent Storage Configuration (MinIO)
      persistentStorage:
        persistentStoreType: s3
        s3:
          bucket: spinnaker
          rootFolder: front50
          endpoint: http://minio.minio.svc.cluster.local:9000
          accessKeyId: minioadmin
          secretAccessKey: minioadmin123
          pathStyleAccess: true
      
      # Security Configuration - DISABLED (using profiles for basic auth instead)
      # security:
      #   apiSecurity:
      #     ssl:
      #       enabled: false
      #     overrideBaseUrl: http://localhost:8084
      #   uiSecurity:
      #     ssl:
      #       enabled: false
      #     overrideBaseUrl: http://localhost:9000
      #   
      #   # Authentication Configuration
      #   authn:
      #     enabled: true
      #     
      #     # Basic Auth
      #     basic:
      #       enabled: true
      #       user:
      #         username: admin
      #         password: admin
      #     
      #     # OAuth2 (GitHub) - Not configured
      #     # oauth2:
      #     #   enabled: true
      #     #   client:
      #     #     clientId: YOUR_GITHUB_CLIENT_ID
      #     #     clientSecret: YOUR_GITHUB_CLIENT_SECRET
      #     #     userAuthorizationUri: https://github.com/login/oauth/authorize
      #     #     accessTokenUri: https://github.com/login/oauth/access_token
      #     #     scope: user:email
      #     #   resource:
      #     #     userInfoUri: https://api.github.com/user
      #     #   userInfoMapping:
      #     #     email: email
      #     #     firstName: name
      #     #     lastName: ""
      #     #     username: login
      
      # Provider Configuration
      providers:
        kubernetes:
          enabled: true
          accounts:
          # Docker Desktop (local) account
          - name: docker-desktop
            providerVersion: V2
            onlySpinnakerManaged: false
            kubeconfigFile: encryptedFile:k8s!n:spin-secrets!k:kubeconfig-docker-desktop
          
          # Minikube account (uncomment and configure if needed)
          # - name: minikube
          #   providerVersion: V2
          #   onlySpinnakerManaged: false
          #   kubeconfigFile: encryptedFile:k8s!n:spin-secrets!k:kubeconfig-minikube
          
          primaryAccount: docker-desktop
      
      # CI Configuration (Jenkins)
      ci:
        jenkins:
          enabled: true
          masters:
          - name: jenkins
            address: http://jenkins.jenkins.svc.cluster.local:8080
            username: admin
            password: admin  # Change after initial setup
            permissions: {}
      
      # Features
      features:
        artifacts: true
        
      # Deployment Configuration
      deploymentEnvironment:
        size: SMALL
        type: Distributed
        accountName: docker-desktop
        updateVersions: true
        gitConfig:
          upstreamUser: spinnaker
        haServices:
          clouddriver:
            enabled: false
          echo:
            enabled: false
    
    # Service Settings
    service-settings:
      clouddriver:
        kubernetes:
          serviceAccountName: spinnaker-service-account
      gate:
        healthEndpoint: /health
      deck:
        env:
          API_HOST: http://spin-gate.spinnaker.svc.cluster.local:8084
    
    # Profiles (halconfig snippets)
    profiles:
      # Deck (UI) configuration - Enable basic form authentication
      deck:
        settings-local.js: |
          window.spinnakerSettings = window.spinnakerSettings || {};
          window.spinnakerSettings.authEnabled = true;
      
      # Gate (API Gateway) configuration - Basic form authentication
      gate:
        # Basic form authentication
        security:
          basicform:
            enabled: true
        
        # Spring Security configuration with credentials
        spring:
          security:
            user:
              name: admin
              password: admin123
        
        server:
          servlet:
            context-path: /
        
        # CORS Configuration
        cors:
          allowed-origins-pattern: ^https?://(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::[0-9]+)?/?$
      
      front50:
        spinnaker:
          s3:
            versioning: false
      
      clouddriver:
        artifacts:
          s3:
            enabled: true
            accounts:
            - name: minio-artifacts
              region: us-east-1
              endpoint: http://minio.minio.svc.cluster.local:9000
              accessKeyId: minioadmin
              secretAccessKey: minioadmin123
              pathStyleAccess: true
  
  # Expose Services
  expose:
    type: service
    service:
      type: ClusterIP
      annotations: {}
      overrides:
        gate:
          publicPort: 8084
        deck:
          publicPort: 9000
