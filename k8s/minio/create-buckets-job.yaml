apiVersion: batch/v1
kind: Job
metadata:
  name: create-minio-buckets
  namespace: minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for MinIO to be ready..."
          sleep 10
          
          # Configure mc client
          mc alias set myminio http://minio.minio.svc.cluster.local:9000 minioadmin minioadmin123
          
          # Create spinnaker bucket
          mc mb myminio/spinnaker || true
          
          # Set bucket policy to public (for development only)
          mc anonymous set download myminio/spinnaker
          
          echo "Bucket 'spinnaker' created successfully"
          
          # List buckets to verify
          mc ls myminio
